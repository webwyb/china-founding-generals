# Install after Certbot has issued shanhe.binnwu.top's certificate.
# Keep nginx.conf's separate IP host for local deployment health checks.
server {
    listen 80;
    listen [::]:80;
    server_name shanhe.binnwu.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://shanhe.binnwu.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shanhe.binnwu.top;
    ssl_certificate /etc/letsencrypt/live/shanhe.binnwu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shanhe.binnwu.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ShanheSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/shanhe/current;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /version.json {
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
