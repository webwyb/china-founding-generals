name: H5 checks and deployment

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'data/testing/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'data/testing/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  SHANHE_ASSET_BASE_URL: https://media-1301987491.cos.ap-beijing.myqcloud.com/shanhe/assets

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-dev.lock
      - run: npm ci
      - run: npm run setup:python
      - run: npm run check
      - name: Check deployment archive and rollback behavior
        run: |
          python3 scripts/deploy/test_receive.py
          python3 scripts/deploy/test_assets.py
          python3 scripts/deploy/test_release.py
      - name: Package checked H5 build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          node scripts/deploy/prepare-assets.mjs
          python3 scripts/deploy/package-release.py build
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: h5-production
          path: release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://shanhe.binnwu.top
    concurrency:
      group: shanhe-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: h5-production
          path: release
      - name: Publish checked build and verify public version
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash release/publish.sh
