name: H5 checks and deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SHANHE_ASSET_BASE_URL: https://media-1301987491.cos.ap-beijing.myqcloud.com/shanhe/assets

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-dev.lock
      - run: npm ci
      - run: npm run setup:python
      - run: npm run check
      - name: Check deployment archive and rollback behavior
        if: runner.os != 'Windows'
        run: |
          python3 scripts/deploy/test_receive.py
          python3 scripts/deploy/test_assets.py
      - name: Package checked H5 build
        if: matrix.os == 'ubuntu-24.04' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          node scripts/deploy/prepare-assets.mjs
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('dist/h5/version.json').write_text(json.dumps({
              'sha': os.environ['GITHUB_SHA'],
              'run': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }) + '\n')
          PY
          tar -czf h5.tar.gz -C dist/h5 .
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: matrix.os == 'ubuntu-24.04' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: h5-production
          path: h5.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: http://49.233.60.125
    concurrency:
      group: shanhe-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: h5-production
          path: release
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Upload immutable COS assets
        env:
          COS_BUCKET: media-1301987491
          COS_REGION: ap-beijing
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r scripts/requirements-deploy.lock
          mkdir -p dist/h5
          tar -xzf release/h5.tar.gz -C dist/h5
          node scripts/deploy/prepare-assets.mjs
          .venv/bin/python scripts/deploy/upload-assets.py
          tar --exclude='./static/*' -czf release/code.tar.gz -C dist/h5 .
      - name: Publish checked build and verify public version
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/deploy/publish.sh
